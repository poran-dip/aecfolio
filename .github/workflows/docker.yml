name: "Build and Smoke-Test Docker Images"

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - "compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "turbo.json"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build images and boot the stack
    runs-on: ubuntu-latest
    env:
      AECFOLIO_TAG: ci
      POSTGRES_USER: aecfolio
      POSTGRES_DB: aecfolio
      PUBLIC_ORIGIN: http://localhost
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/db/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/poran-dip/aecfolio-migrator:ci
          cache-from: type=gha,scope=migrator

      - name: Build api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/poran-dip/aecfolio-api:ci
          cache-from: type=gha,scope=api

      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/poran-dip/aecfolio-web:ci
          cache-from: type=gha,scope=web

      - name: Build worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/poran-dip/aecfolio-worker:ci
          cache-from: type=gha,scope=worker

      - name: Generate throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "S3_ACCESS_KEY_ID=GK$(openssl rand -hex 12)"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)"
            echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)"
            echo "WORKER_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180 --no-build

      - name: Web through nginx
        run: curl -fsS --retry 5 --retry-all-errors -o /dev/null http://localhost/

      - name: API through nginx
        run: curl -fsS --retry 5 --retry-all-errors http://localhost/api/health

      - name: Worker launches Chromium and accepts the shared secret
        run: |
          docker compose exec -T worker node -e '
            const base = "http://127.0.0.1:3001";
            const check = async (path, init) => {
              const res = await fetch(base + path, init);
              if (!res.ok) throw new Error(`${path}: ${res.status} ${await res.text()}`);
              console.log(path, await res.text());
            };
            (async () => {
              await check("/health");
              await check("/version", { headers: { authorization: `Bearer ${process.env.WORKER_SECRET}` } });
            })().catch((err) => { console.error(err); process.exit(1); });
          '

      - name: Bundles inline every workspace package but config
        run: |
          for svc in api worker; do
            imports=$(docker compose run --rm --no-deps --entrypoint sh "$svc" -c \
              "grep -ohE '[\"'\'']@aecfolio/[a-z/-]+[\"'\'']' apps/$svc/dist/*.mjs || [ \$? -eq 1 ]")
            leaked=$(printf '%s\n' "$imports" | tr -d "\"'" | sort -u | grep -vx -e '@aecfolio/config' -e '' || true)
            if [ -n "$leaked" ]; then
              echo "::error::$svc bundle imports $leaked at runtime"
              exit 1
            fi
          done

      - name: Stack status and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 200
