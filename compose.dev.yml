name: aecfolio-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aecfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-aecfolio}
    ports:
      - "6432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aecfolio} -d ${POSTGRES_DB:-aecfolio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
