name: aecfolio-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aecfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-aecfolio}
    ports:
      - "15432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aecfolio} -d ${POSTGRES_DB:-aecfolio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?see .env.example}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?see .env.example}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?see .env.example}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-storage}
    ports:
      - "3900:3900"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_dev_data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
  garage_dev_data:
